[package]
name = "comfy-silly"
version = "0.3.0"
description = "ComfySilly - Node-based SillyTavern Workflow Desktop Engine"
authors = ["you"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "comfy_silly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
dirs = "6"
base64 = "0.22"

reqwest = { version = "0.13", features = ["json", "stream"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
